<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>連絡先検索</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Yu Gothic",sans-serif;color:#111827;background:#f4f5f7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:820px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(40px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}h1{font-size:22px;margin:0}.muted{color:#6b7280;font-size:13px}.card{background:white;border-radius:15px;padding:14px;margin:10px 0;box-shadow:0 1px 3px #00000012}.search{position:sticky;top:0;background:#f4f5f7;padding:8px 0 10px;z-index:3}input[type=search],input[type=email],input[type=password]{width:100%;font-size:17px;padding:13px;border:1px solid #d1d5db;border-radius:12px;background:white}button{font-size:15px;border:0;border-radius:10px;padding:10px 13px;background:#111827;color:white}button.secondary{background:#e5e7eb;color:#111827}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.name{font-size:19px;font-weight:700}.org{margin-top:4px;font-size:15px}.role{color:#374151;margin-top:3px}.contact{margin-top:9px;font-size:15px}.contact a{color:#0b57d0;text-decoration:none}.tag{display:inline-block;background:#eef2ff;border-radius:999px;padding:3px 8px;font-size:12px;margin:3px 3px 0 0}.shared{background:#ecfdf5}.old{opacity:.72}.hidden{display:none}.error{color:#b91c1c}.topline{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.serial{color:#9ca3af;font-size:11px}.login{max-width:420px;margin:70px auto}.login h2{margin-top:0}.login input{margin:6px 0}.count{font-size:13px;color:#6b7280;margin:7px 2px}.switch{font-size:13px;display:flex;align-items:center;gap:7px}.empty{text-align:center;color:#6b7280;padding:40px 0}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body><div class="wrap">
<div id="login" class="card login hidden"><h2>連絡先検索</h2><p class="muted">Supabase に登録したアカウントでログインします。</p><input id="email" type="email" autocomplete="username" placeholder="メールアドレス"><input id="password" type="password" autocomplete="current-password" placeholder="パスワード"><div class="row" style="margin-top:8px"><button id="loginBtn">ログイン</button></div><p id="loginMsg" class="muted"></p></div>
<div id="app" class="hidden">
<header><div><h1>連絡先検索</h1><div id="who" class="muted"></div></div><button id="logoutBtn" class="secondary">ログアウト</button></header>
<div class="search"><input id="q" type="search" placeholder="石川県警 / 千葉生総 / 樋口 / 関東交流会" autocomplete="off" autocapitalize="off"><div class="row" style="margin-top:8px"><label class="switch"><input id="history" type="checkbox">過去所属も含める</label><span id="count" class="count"></span></div></div>
<div id="results"></div>
</div>
</div>
<script src="config.js"></script>
<script>
const cfg=window.CONTACT_APP_CONFIG||{};
if(!cfg.supabaseUrl||!cfg.publishableKey||cfg.supabaseUrl.includes('YOUR_')){
 document.body.innerHTML='<div class="wrap"><div class="card"><h2>初期設定が必要です</h2><p>config.js に Supabase Project URL と Publishable key を設定してください。</p></div></div>'; throw new Error('missing config');
}
const sb=supabase.createClient(cfg.supabaseUrl,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true}});
const aliasMap={"生総":"生活安全総務課","生企":"生活安全企画課","科捜研":"科学捜査研究所","人安":"人身安全","犯抑":"犯罪抑止"};
function terms(q){let x=(q||'').replace(/　/g,' ').trim(); Object.entries(aliasMap).sort((a,b)=>b[0].length-a[0].length).forEach(([a,e])=>{x=x.split(a).join(' '+e+' ')}); return x.split(/\s+/).filter(Boolean)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function telHref(v){return 'tel:'+String(v).replace(/[^0-9+]/g,'')}
function render(rows){const box=document.getElementById('results');document.getElementById('count').textContent=rows.length+'件';if(!rows.length){box.innerHTML='<div class="empty">該当なし</div>';return}box.innerHTML=rows.map(r=>{let emails=[...(r.emails||[])];let shared=(r.shared_contacts||[]).filter(x=>x.kind==='email');let phones=r.phones||[];return `<div class="card ${r.is_current?'':'old'}"><div class="topline"><div><div class="name">${esc(r.full_name)}</div><div class="org">${esc(r.organization||'')} ${esc(r.department||'')} ${esc(r.unit_name||'')}</div><div class="role">${esc([r.role,r.rank].filter(Boolean).join(' / '))}</div></div><div class="serial">#${esc(r.legacy_serial)}</div></div>${emails.map(e=>`<div class="contact">✉︎ <a href="mailto:${esc(e.value)}">${esc(e.value)}</a></div>`).join('')}${shared.map(e=>`<div class="contact">✉︎ <a href="mailto:${esc(e.value)}">${esc(e.value)}</a> <span class="tag shared">部署共用</span></div>`).join('')}${phones.map(p=>p.kind==='extension'?`<span class="tag">内線 ${esc(p.value)}</span>`:`<div class="contact">☎︎ <a href="${telHref(p.value)}">${esc(p.value)}</a> ${p.kind==='mobile'?'<span class="tag">携帯</span>':''}</div>`).join('')}${r.last_contact_on?`<div class="muted" style="margin-top:8px">最終接触 ${esc(r.last_contact_on)}${r.source_event?' / '+esc(r.source_event):''}</div>`:''}${r.is_current?'':'<span class="tag">旧所属</span>'}</div>`}).join('')}
let timer;
async function search(){const q=document.getElementById('q').value; if(!q.trim()){document.getElementById('results').innerHTML='<div class="empty">検索語を入力してください</div>';document.getElementById('count').textContent='';return} const {data,error}=await sb.rpc('search_contacts',{p_terms:terms(q),p_include_history:document.getElementById('history').checked,p_limit:100}); if(error){document.getElementById('results').innerHTML='<div class="card error">'+esc(error.message)+'</div>';return} render(data||[])}
document.getElementById('q').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(search,120)});document.getElementById('history').addEventListener('change',search);
document.getElementById('loginBtn').onclick=async()=>{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;document.getElementById('loginMsg').textContent='ログイン中…';const {error}=await sb.auth.signInWithPassword({email,password});document.getElementById('loginMsg').textContent=error?error.message:''};
document.getElementById('logoutBtn').onclick=()=>sb.auth.signOut();
async function setUI(session){if(session){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('who').textContent=session.user.email||'';document.getElementById('q').focus()}else{document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}}
sb.auth.onAuthStateChange((_e,s)=>setUI(s)); sb.auth.getSession().then(({data})=>setUI(data.session));
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
